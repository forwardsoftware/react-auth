name: Build & Test

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test

    strategy:
      matrix:
        # 22 tracks the previous Node.js LTS line; pnpm/setup has no "previous LTS" alias, so bump this manually when Node.js LTS rotates
        node_version: [22, lts, latest]
        package:
          - "@forward-software/react-auth"
          - "@forward-software/react-auth-google"
          - "@forward-software/react-auth-apple"
      fail-fast: false

    runs-on: "ubuntu-latest"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm & Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@${{ matrix.node_version }}
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Test package
        run: pnpm --filter "${{ matrix.package }}" test

  build:
    name: Build

    strategy:
      matrix:
        package:
          - "@forward-software/react-auth"
          - "@forward-software/react-auth-google"
          - "@forward-software/react-auth-apple"
      fail-fast: false

    runs-on: "ubuntu-latest"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm & Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@lts
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Build package
        run: pnpm --filter "${{ matrix.package }}" build
