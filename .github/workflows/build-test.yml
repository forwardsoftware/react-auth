name: Build & Test

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test

    strategy:
      matrix:
        node_version: [lts/-1, lts/*, latest]
        package:
          - "@forward-software/react-auth"
          - "@forward-software/react-auth-google"
          - "@forward-software/react-auth-apple"
      fail-fast: false

    runs-on: "ubuntu-latest"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true
          install: false

      - name: Setup NodeJS
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node_version }}

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Install peerDependencies
        run: pnpm install --no-frozen-lockfile --config.auto-install-peers=true

      - name: Test package
        run: pnpm --config.auto-install-peers=true --filter "${{ matrix.package }}" test

  build:
    name: Build

    strategy:
      matrix:
        package:
          - "@forward-software/react-auth"
          - "@forward-software/react-auth-google"
          - "@forward-software/react-auth-apple"
      fail-fast: false

    runs-on: "ubuntu-latest"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true
          install: false

      - name: Setup NodeJS
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Install peerDependencies
        run: pnpm install --no-frozen-lockfile --config.auto-install-peers=true

      - name: Build package
        run: pnpm --config.auto-install-peers=true --filter "${{ matrix.package }}" build
